name: Release OpenRaR (Windows, Linux, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build, Test, and Package Windows Release
        shell: pwsh
        run: .\scripts\package_release.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/OpenRaR-*-win64.zip
            dist/OpenRaR-Setup-*-win64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install Build Tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build dpkg-dev

      - name: Configure, Build & Test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package Tarball & DEB
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist "dist/OpenRaR-$V-linux-x86_64"
          cp build/openrar build/openrar_sfx_stub assets/openrar.svg README.md LICENSE \
             installer/unix/install.sh installer/unix/uninstall.sh \
             "dist/OpenRaR-$V-linux-x86_64/"
          chmod +x "dist/OpenRaR-$V-linux-x86_64/install.sh" "dist/OpenRaR-$V-linux-x86_64/uninstall.sh"
          tar -C dist -czf "dist/OpenRaR-$V-linux-x86_64.tar.gz" "OpenRaR-$V-linux-x86_64"
          (cd build && cpack -G DEB)
          cp build/*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/OpenRaR-*-linux-x86_64.tar.gz
            dist/*.deb

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine Version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install Ninja
        run: brew install ninja

      - name: Configure, Build & Test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Package macOS Tarball
        run: |
          V="${{ steps.ver.outputs.version }}"
          ARCH="$(uname -m)"
          mkdir -p dist "dist/OpenRaR-$V-macos-$ARCH"
          cp build/openrar build/openrar_sfx_stub assets/openrar.svg README.md LICENSE \
             installer/unix/install.sh installer/unix/uninstall.sh \
             "dist/OpenRaR-$V-macos-$ARCH/"
          chmod +x "dist/OpenRaR-$V-macos-$ARCH/install.sh" "dist/OpenRaR-$V-macos-$ARCH/uninstall.sh"
          tar -C dist -czf "dist/OpenRaR-$V-macos-$ARCH.tar.gz" "OpenRaR-$V-macos-$ARCH"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/OpenRaR-*-macos-*.tar.gz

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
